<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <meta name="description" content="Teste tes connaissances sur l’Art déco et la reconstruction de Chauny avec ce quiz de dix questions.">
  <title>Quiz Art déco | Chauny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const questions = [
        {text:'Qui remporte le plan de reconstruction de Chauny en 1919 ?',answers:[['rey','Louis Rey'],['luciani','Charles Luciani'],['bourdet','François Eugène Bourdet']],correct:'rey',explanation:'Louis Rey est lauréat du plan de reconstruction de Chauny en 1919.'},
        {text:'Dans quelle ville Louis Rey est-il né ?',answers:[['monaco','Monaco'],['chauny','Chauny'],['strasbourg','Strasbourg']],correct:'monaco',explanation:'Louis Rey est né à Monaco.'},
        {text:'À quelles épreuves Louis Rey participe-t-il en 1928 ?',answers:[['architecture','Aux épreuves d’architecture des Jeux olympiques'],['natation','Aux épreuves de natation'],['cyclisme','Aux épreuves de cyclisme']],correct:'architecture',explanation:'Il participe aux épreuves d’architecture des Jeux olympiques de 1928.'},
        {text:'Quelles distinctions Louis Rey reçoit-il pour ses expositions ?',answers:[['medailles','Des médailles d’or à Gand en 1921 et Strasbourg en 1923'],['palmes','Les Palmes académiques à Paris'],['aucune','Aucune distinction']],correct:'medailles',explanation:'Il reçoit des médailles d’or aux expositions de Gand et de Strasbourg.'},
        {text:'Où Charles Luciani est-il né ?',answers:[['albertacce','À Albertacce, en Corse'],['monaco','À Monaco'],['chauny','À Chauny']],correct:'albertacce',explanation:'Charles Luciani est né à Albertacce, en Corse.'},
        {text:'Qui dessine le marché aux poissons de Chauny ?',answers:[['luciani','Charles Luciani'],['rey','Louis Rey'],['gentil','Alphonse Gentil']],correct:'luciani',explanation:'Le marché aux poissons est conçu par l’architecte Charles Luciani.'},
        {text:'Quel autre édifice de Chauny est une réalisation de Charles Luciani ?',answers:[['notre-dame','L’église Notre-Dame'],['banque','La banque Dupont'],['hopital','L’hôpital']],correct:'notre-dame',explanation:'Parmi ses réalisations à Chauny figurent l’église Notre-Dame, le kiosque à musique et le bâtiment des sociétés.'},
        {text:'Quel matériau est associé à la maison Gentil et Bourdet ?',answers:[['gres','Le grès flammé'],['marbre','Le marbre blanc'],['bois','Le bois sculpté']],correct:'gres',explanation:'Gentil et Bourdet est une manufacture de grès flammés.'},
        {text:'Entre quelles années Gentil et Bourdet est-elle fondée ?',answers:[['1900','Entre 1900 et 1905'],['1880','Entre 1880 et 1885'],['1930','Entre 1930 et 1935']],correct:'1900',explanation:'La manufacture est fondée entre 1900 et 1905.'},
        {text:'Quels détails Art déco peut-on observer sur les immeubles autour de la place ?',answers:[['tous','Mosaïques, garde-corps, pans coupés et pergolas'],['colonnes','Uniquement des colonnes antiques'],['vitraux','Uniquement des vitraux modernes']],correct:'tous',explanation:'La place présente notamment des mosaïques, des garde-corps, des pans coupés et des pergolas.'}
      ];
      const form = document.querySelector('#quiz-form');
      const questionList = document.querySelector('#questions');
      const result = document.querySelector('#quiz-result');
      const progress = document.querySelector('#quiz-progress');
      const progressLabel = document.querySelector('#progress-label');

      questions.forEach((question, index) => {
        const fieldset = document.createElement('fieldset');
        fieldset.className = 'question';
        fieldset.dataset.index = String(index);
        const legend = document.createElement('legend');
        legend.textContent = `${index + 1}. ${question.text}`;
        fieldset.append(legend);
        const answers = document.createElement('div');
        answers.className = 'answers';
        const shuffledAnswers = [...question.answers];
        for (let answerIndex = shuffledAnswers.length - 1; answerIndex > 0; answerIndex -= 1) {
          const swapIndex = Math.floor(Math.random() * (answerIndex + 1));
          [shuffledAnswers[answerIndex], shuffledAnswers[swapIndex]] = [shuffledAnswers[swapIndex], shuffledAnswers[answerIndex]];
        }
        shuffledAnswers.forEach(([value, label], answerIndex) => {
          const answerLabel = document.createElement('label');
          answerLabel.className = 'answer';
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `q${index + 1}`;
          input.value = value;
          if (answerIndex === 0) input.required = true;
          answerLabel.append(input, document.createTextNode(label));
          answers.append(answerLabel);
        });
        const feedback = document.createElement('p');
        feedback.className = 'question-feedback';
        feedback.id = `feedback-${index + 1}`;
        fieldset.append(answers, feedback);
        questionList.append(fieldset);
      });

      form.addEventListener('change', () => {
        const answered = questions.filter((_, index) => form.querySelector(`[name="q${index + 1}"]:checked`)).length;
        progress.value = answered;
        progressLabel.textContent = `${answered} question${answered > 1 ? 's' : ''} sur ${questions.length}`;
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        const missing = [...questionList.querySelectorAll('.question')].find((fieldset, index) => !form.querySelector(`[name="q${index + 1}"]:checked`));
        if (missing) {
          missing.classList.add('is-missing');
          result.textContent = 'Réponds aux 10 questions avant de voir ton résultat.';
          result.className = 'result error';
          missing.querySelector('input').focus();
          return;
        }
        let score = 0;
        questions.forEach((question, index) => {
          const fieldset = questionList.children[index];
          const selected = form.querySelector(`[name="q${index + 1}"]:checked`).value;
          const correct = selected === question.correct;
          if (correct) score += 1;
          fieldset.classList.remove('is-missing');
          fieldset.classList.add(correct ? 'is-correct' : 'is-wrong');
          fieldset.querySelector('.question-feedback').textContent = correct ? `Bonne réponse. ${question.explanation}` : `La bonne réponse était « ${question.answers.find(([value]) => value === question.correct)[1]} ». ${question.explanation}`;
        });
        result.textContent = `Résultat : ${score} / ${questions.length}${score === questions.length ? ' · Excellent, tu connais bien la place !' : score >= 7 ? ' · Très bon résultat !' : ' · Relis le parcours et réessaie.'}`;
        result.className = 'result';
        result.focus();
      });

      document.querySelector('#reset-quiz').addEventListener('click', () => {
        form.reset();
        questionList.querySelectorAll('.question').forEach(fieldset => {
          fieldset.classList.remove('is-correct','is-wrong','is-missing');
          fieldset.querySelector('.question-feedback').textContent = '';
        });
        progress.value = 0;
        progressLabel.textContent = `0 question sur ${questions.length}`;
        result.textContent = '';
        result.className = 'result';
      });
    });
  </script>
</head>
<body class="page-quiz">
  <header class="header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="Retour à Chauny Art déco"><span class="brand-mark" aria-hidden="true"><span>C</span></span><span>CHAUNY<br>ART DÉCO</span></a>
    <a class="back-link" href="index.html">← Retour à l’exposition</a>
  </div></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Parcours Art déco · Chauny</p>
      <h1 id="page-title">Le quiz de la place</h1>
      <p>Architectes, reconstruction et détails des façades : dix questions pour tester ce que tu as retenu de la visite.</p>
    </section>
    <div class="progress-row"><strong id="progress-label">0 question sur 10</strong><progress id="quiz-progress" max="10" value="0" aria-label="Progression du quiz"></progress></div>
    <form id="quiz-form" novalidate>
      <div id="questions"></div>
      <div class="actions"><button class="submit" type="submit">Voir mon résultat</button><button class="reset" id="reset-quiz" type="button">Recommencer</button><p class="result" id="quiz-result" role="status" aria-live="polite" tabindex="-1"></p></div>
    </form>
  </main>
  <footer><div class="footer-inner"><span>Parcours Art déco de Chauny · Place du Marché Couvert</span><span>Quiz · 10 questions</span></div></footer>
</body>
</html>
